[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openworklang"
version = "0.1.0"
description = "OpenWorkLang (.work): a declarative agent programming language that compiles to Work IR and LinkML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["openworklang*"]
